apiVersion: batch/v1
kind: CronJob
metadata:
  name: tbot-nightly
  namespace: tbot
spec:
  schedule: "30 2 * * 2-6"   # 02:30 UTC Tue-Sat = after US close Mon-Fri
  # Pinned explicitly, as elsewhere on quasar. Without spec.timeZone the
  # schedule is read in the kube-controller-manager's local zone, so "02:30
  # UTC" would hold only by accident of the node being Etc/UTC -- and in
  # Asia/Kolkata it would fire at 21:00 UTC, before the US close it is meant
  # to follow, ingesting a session that has not happened.
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      # Forbid makes a hung run permanent, not merely late: while the pod is
      # alive every later window is skipped, silently, with no failed Job to
      # notice. A vendor socket that never returns would quietly end the
      # nightly. An hour is many times the honest runtime, so reaching it means
      # stuck -- and failing the Job hands the schedule back to the next window.
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000       # the uid deploy/Dockerfile creates and USERs
            # The kubelet chowns the PVC to this gid on mount. That, not
            # anything in the image, is what lets the job write /data.
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: nightly
              image: tbot-nightly:latest   # built/pushed per private-configs conventions
              # Mandatory, not stylistic: quasar has no registry, the image is
              # imported straight into k3s containerd, and the implicit policy
              # for a `latest` tag is Always -- which would ImagePullBackOff.
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
                # readOnlyRootFilesystem is deliberately absent. `uv run` writes
                # under $HOME at start (its cache, and the venv bookkeeping it
                # does even with --frozen), and the full set of paths has not
                # been observed against a real run. Deferred to deploy-time
                # verification: turn it on once a read-only run has been seen to
                # survive, with emptyDir volumes for whatever it still needs.
              # Nightly ingest + reconcile is a few thousand symbols of polars
              # work -- bursty, not sustained. quasar is shared (k3s system
              # workloads, ai-proxy, ddns), so the request is what the scheduler
              # should actually set aside and the limit is a ceiling on a bad
              # night rather than an allocation.
              #
              # Memory is measured, not guessed. 2026-09-04, `/usr/bin/time -l`
              # on a full run against the real warehouse: peak RSS 2.04 GB
              # (1.90 GiB), 186s wall. The request is that working set and the
              # limit doubles it.
              #
              # The previous 512Mi/2Gi was a guess and the job was OOMKilled
              # against it: `read_canonical` and `store.read_bars` each collected
              # their whole store before filtering, which put the same run at
              # 25.0 GB. Both now push the window into the lazy scan, and as of
              # 2026-09-05 so does `edgar.read_filings()`.
              #
              # Measured again after that pushdown, on the full new nightly
              # (2,874-symbol universe, actions ingest, split re-base, ledger
              # compaction): peak RSS 1.955 GiB in 190.9s, with the filings read
              # down from 7.8M rows / 1.94 GiB to ~28.6k rows / 0.33 GiB. So the
              # residual is no longer the filings scan -- the reconcile pass over
              # ~2,865 symbols is the leading candidate, and the re-base leg is
              # arithmetically too small to be it.
              #
              # Re-measured 2026-09-05 (fix wave) on the nightly as shipped by
              # the phase-1 hardening branch: 2,877 symbols (2,861 universe +
              # 16 rename targets), both `_drop_pre_break` passes of ruling 43,
              # actions ingest, re-base of 45 symbols (29 splits + 16 rename
              # targets; 49.9k alpaca + 86.6k yf rows re-voted), the ticker-map
              # rebuild (`tickers.build`), ledger compaction: peak RSS
              # 2,157,821,952 B = 2.01 GiB in 206.1s. The peak sits 10 MB above
              # the request -- a scheduling hint, not a ceiling -- and half the
              # limit. The plan's rule (below 1.0 GiB: 1Gi/2Gi; above 4 GiB:
              # raise) leaves both pins where they are.
              resources:
                requests: {cpu: "250m", memory: "2Gi"}
                limits: {cpu: "2", memory: "4Gi"}
              envFrom:
                - secretRef: {name: tbot-secrets}   # APCA_API_KEY_ID / APCA_API_SECRET_KEY
              volumeMounts:
                - {name: data, mountPath: /data}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: tbot-data}
